name: render

on:
  workflow_dispatch:
    inputs:
      segments:
        description: how many machines to split the film across
        default: '18'
      quality:
        description: render quality (ss = 3-D buffer scale)
        default: '0.45'
      from:
        description: start second (blank = start of film)
        default: ''
      to:
        description: end second (blank = end of film)
        default: ''
      reuse_run:
        description: run id whose finished film supplies everything after 'to' (re-render only changed scenes)
        default: ''

jobs:
  split:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - id: plan
        run: |
          N=${{ github.event.inputs.segments }}
          echo "matrix=$(node -e "
            const n=${N:-9}, D=require('./score.js').DURATION;
            console.log(JSON.stringify([...Array(n).keys()]));
          ")" >> $GITHUB_OUTPUT

  render:
    needs: split
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seg: ${{ fromJson(needs.split.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg flac
          google-chrome --version || true
          nproc
      - name: sound
        run: |
          mkdir -p out
          ffmpeg -v error -y -i audio/vo.flac out/vo.wav
          VO=1 node song.js
      - name: render this slice
        env:
          RQ: ss=${{ github.event.inputs.quality }}&ao=16
        run: |
          N=${{ github.event.inputs.segments }}
          read FROM TO < <(node -e "
            const n=${N:-9}, i=${{ matrix.seg }};
            const T0=parseFloat('${{ github.event.inputs.from }}'||'0');
            const T1=parseFloat('${{ github.event.inputs.to }}'||'0')||require('./score.js').DURATION;
            const D=T1-T0, a=T0+D/n*i, b=i===n-1?T1:T0+D/n*(i+1);
            console.log(a.toFixed(3), b.toFixed(3));
          ")
          echo \"slice ${{ matrix.seg }}: $FROM .. $TO\"
          node engine/render.js clip $FROM $TO
          mv out/clip_*.mp4 "out/part-$(printf %02d ${{ matrix.seg }}).mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.seg }}
          path: out/part-*.mp4
          retention-days: 3

  join:
    needs: render
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { path: parts, pattern: 'part-*', merge-multiple: true }
      - if: ${{ github.event.inputs.reuse_run != '' }}
        uses: actions/download-artifact@v4
        with: { name: bunker3d, path: prev, run-id: '${{ github.event.inputs.reuse_run }}', github-token: '${{ github.token }}' }
      - name: join the slices, splice the unchanged tail, lay the full soundtrack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg flac
          mkdir -p out && ffmpeg -v error -y -i audio/vo.flac out/vo.wav && VO=1 node song.js && ffmpeg -v error -y -i out/music.wav -i audio/bed.flac -i out/vo.wav -filter_complex "[1:a]aresample=48000,volume=0.32[b];[2:a]aresample=48000[k];[b][k]sidechaincompress=threshold=0.04:ratio=4:attack=30:release=500[d];[0:a][d]amix=inputs=2:normalize=0:duration=first,alimiter=limit=0.89" out/mix.wav && mv out/mix.wav out/music.wav
          for f in $(ls parts/part-*.mp4 | sort); do echo "file '$PWD/$f'" >> list.txt; done
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -an -c copy head.mp4
          if [ -f prev/bunker3d.mp4 ]; then
            TO='${{ github.event.inputs.to }}'
            ffmpeg -v error -y -ss "$TO" -i prev/bunker3d.mp4 -an -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -r 60 tail.mp4
            printf "file '$PWD/head.mp4'\nfile '$PWD/tail.mp4'\n" > l2.txt
            ffmpeg -v error -y -f concat -safe 0 -i l2.txt -c copy video.mp4
          else mv head.mp4 video.mp4; fi
          ffmpeg -v error -y -i video.mp4 -i out/music.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart bunker3d.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 bunker3d.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: bunker3d
          path: bunker3d.mp4
          retention-days: 14
