name: remix-sound
# Re-lays ONLY the soundtrack on a finished film (no re-rendering of picture): ~2 minutes.
on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: run id whose finished film (artifact bunker3d) supplies the picture
        required: true
jobs:
  remix:
    runs-on: ubuntu-latest
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: bunker3d, path: prev, run-id: '${{ github.event.inputs.reuse_run }}', github-token: '${{ github.token }}' }
      - name: lay the new soundtrack on the old picture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p out && node song.js
          ffmpeg -v error -y -i prev/bunker3d.mp4 -i out/music.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart bunker3d.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 bunker3d.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: bunker3d-sound
          path: bunker3d.mp4
          retention-days: 14
